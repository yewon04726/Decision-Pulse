<text class="n-title" x="1476" y="243">Agent guardrails</text>
<text class="n-sub" x="1446" y="274">Hermes toolsets: decision-debt + gbrain only</text>
<text class="n-sub" x="1446" y="292">(no terminal · file · browser · memory)</text>
<text class="n-sub" x="1446" y="310"></text>
<text class="n-sub" x="1446" y="328">Both MCP servers are read-only</text>
<text class="n-sub" x="1446" y="346"></text>
<text class="n-sub" x="1446" y="364">Hermes cannot approve, edit or create</text>
<text class="n-sub" x="1446" y="382">Decisions</text>
<text class="n-sub" x="1446" y="400"></text>
<text class="n-sub" x="1446" y="418">Review Memo facts are rendered by</text>
<text class="n-sub" x="1446" y="436">the backend from SQLite, never by the model</text>
<text class="n-sub" x="1446" y="454"></text>
<text class="n-sub" x="1446" y="472">Tool calls audited per session</text>
<rect class="note" x="64" y="730" width="380" height="140" rx="10"/>
<text class="n-sub" x="80" y="756">Extraction is local-first and runs in FastAPI.</text>
<text class="n-sub" x="80" y="773"></text>
<text class="n-sub" x="80" y="790">OpenRouter GLM-5.3 is called only when the</text>
<text class="n-sub" x="80" y="807">local model fails to structure a candidate.</text>
<text class="n-sub" x="80" y="824"></text>
<text class="n-sub" x="80" y="841">Hermes is not part of extraction.</text>
<text class="n-sub" x="80" y="858">Nothing becomes a Decision without approval.</text>
<rect class="note" x="1462" y="770" width="294" height="96" rx="10"/>
<text class="n-sub" x="1478" y="796">SQLite stays the source of truth.</text>
<text class="n-sub" x="1478" y="816">gbrain and Dify hold searchable</text>
<text class="n-sub" x="1478" y="836">copies of verified Decisions only.</text>
<text class="n-sub" x="520" y="1104">Alert only when a new ACTIVE → REVIEW_DUE event is created · no repeats while a Decision stays REVIEW_DUE</text>
<text class="n-sub" x="520" y="1121">no alert for decisions already due at first check (baseline) or for recovery REVIEW_DUE → ACTIVE</text>
<text class="edge-label" x="60" y="912" text-anchor="start">selective fallback ↓ · structured result ↑</text>
<text class="edge-label" x="1000" y="760" text-anchor="start">Dify Knowledge sync (copy of verified Decisions)</text>
