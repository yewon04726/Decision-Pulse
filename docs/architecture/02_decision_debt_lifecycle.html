<text class="n-sub" x="362" y="596">Escalate only when local structuring fails. Not for: zero candidates ·</text>
<text class="n-sub" x="362" y="611">semantic/manual conditions · title fallback only · unknown metric only</text>
<rect class="note human" x="805" y="150" width="210" height="140" rx="10"/>
<text class="note-t" x="817" y="170">Approval gate</text>
<text class="n-sub" x="817" y="188">Only approved candidates</text>
<text class="n-sub" x="817" y="204">become verified Decisions.</text>
<text class="n-sub" x="817" y="220"></text>
<text class="n-sub" x="817" y="236">LLM output is never stored</text>
<text class="n-sub" x="817" y="252">as a confirmed Decision</text>
<text class="n-sub" x="817" y="268">without human approval.</text>
<rect class="note copy" x="1380" y="380" width="576" height="62" rx="10"/>
<text class="n-sub" x="1392" y="400">gbrain and Dify hold searchable copies of verified Decisions.</text>
<text class="n-sub" x="1392" y="416">SQLite stays the single source of truth.</text>
<rect class="statebox" x="44" y="952" width="486" height="112" rx="10"/>
<text class="note-t" x="56" y="972">Review State (per Decision)</text>
<rect class="state active" x="70" y="986" width="130" height="50" rx="25"/><text class="state-t" x="135" y="1016" text-anchor="middle">ACTIVE</text>
<rect class="state due" x="330" y="986" width="170" height="50" rx="25"/><text class="state-t" x="415" y="1016" text-anchor="middle">REVIEW_DUE</text>
<path class="edge c-event" d="M200,998 L330,998" marker-end="url(#a-c-event)"/><text class="edge-label" x="265" y="991" text-anchor="middle">condition true</text>
<path class="edge c-flow" d="M330,1026 L200,1026" marker-end="url(#a-c-flow)"/><text class="edge-label" x="265" y="1048" text-anchor="middle">recovery</text>
<rect class="note" x="44" y="1080" width="486" height="162" rx="10"/>
<text class="note-t" x="56" y="1100">Event semantics</text>
<text class="n-sub" x="56" y="1118">• first check already true → baseline REVIEW_DUE, no event</text>
<text class="n-sub" x="56" y="1134">• same state on the next check → no new event</text>
<text class="n-sub" x="56" y="1150">• REVIEW_DUE → ACTIVE → recovery (no alert)</text>
<text class="n-sub" x="56" y="1166">• after recovery, ACTIVE → REVIEW_DUE triggers again</text>
<text class="n-sub" x="56" y="1182"></text>
<text class="n-sub" x="56" y="1198">Only the ACTIVE → REVIEW_DUE transition creates a</text>
<text class="n-sub" x="56" y="1214">Review Event.</text>
<rect class="note notify" x="588" y="740" width="244" height="150" rx="10"/>
<text class="note-t" x="600" y="760">Notification rule</text>
<text class="n-sub" x="600" y="778">One Telegram alert per new</text>
<text class="n-sub" x="600" y="794">Review Event.</text>
<text class="n-sub" x="600" y="810"></text>
<text class="n-sub" x="600" y="826">No alert for baseline</text>
<text class="n-sub" x="600" y="842">REVIEW_DUE, for unchanged</text>
<text class="n-sub" x="600" y="858">state, or for recovery.</text>
